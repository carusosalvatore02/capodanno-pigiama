<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capodanno in Pigiama – TV</title>
<meta name="theme-color" content="#1B2346">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B2346;--bg2:#232D58;--card:rgba(255,246,229,.08);--line:rgba(255,246,229,.18);--ink:#FFF6E5;--mute:#C9C6D6;--acc:#FFC857;--pink:#FF9EB1;--green:#1E5B43;--bad:#FF8A8A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
.f{font-family:'Fredoka',system-ui,sans-serif;font-weight:700}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;overflow:hidden;background:radial-gradient(80% 60% at 50% -10%,#2B3A78 0%,rgba(27,35,70,0) 60%),linear-gradient(180deg,#1B2346 0%,#141A38 100%);transform-origin:center center;flex:none}
#scena{position:absolute;inset:0;z-index:1}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 60px}
.t{font-family:'Fredoka';font-weight:700;font-size:96px;line-height:1}
.s{font-size:34px;font-weight:800;color:var(--mute)}
.acc{color:var(--acc)}
.lights{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(180deg,rgba(30,91,67,0),rgba(30,91,67,.55) 55%,#1E5B43)}
.lights svg{position:absolute;inset:0;width:100%;height:100%}
.lights i{position:absolute;width:14px;height:21px;border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;transform:translateX(-50%);animation:brilla 2.4s ease-in-out infinite}
.lights i::before{content:'';position:absolute;left:3px;top:-5px;width:8px;height:6px;border-radius:2px;background:#3B4A3F}
@keyframes brilla{0%,100%{opacity:1;filter:brightness(1.1)}50%{opacity:.45;filter:brightness(.7)}}
.luna-tv{position:absolute;right:70px;top:40px;width:190px;height:190px;z-index:1;transform:rotate(-6deg)}
.luna-tv svg{width:100%;height:100%;filter:drop-shadow(0 0 30px rgba(255,200,87,.25))}
.av{border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:4px solid var(--acc);font-family:'Fredoka';font-weight:700;color:var(--acc);flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.famimg{border-radius:24px;overflow:hidden;background:var(--bg2);border:4px solid var(--acc);display:flex;align-items:center;justify-content:center}
.famimg img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:16px}
.fin{display:flex;gap:56px;justify-content:center;margin-top:34px}
.fin>div{display:flex;flex-direction:column;align-items:center;gap:14px;font-size:30px;font-weight:800}
.bar{height:22px;border-radius:11px;background:rgba(255,246,229,.15);overflow:hidden;width:700px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:11px;transition:width .8s}
.card{background:linear-gradient(180deg,rgba(255,246,229,.1),rgba(255,246,229,.04)) #1C244A;border:2px solid rgba(255,246,229,.14);border-radius:22px;padding:16px 26px;box-shadow:0 18px 40px -20px rgba(5,8,25,.9),inset 0 1px 0 rgba(255,246,229,.09)}
.strip{position:absolute;left:0;right:0;bottom:0;padding:14px 30px;background:rgba(0,0,0,.28);display:flex;align-items:center;gap:16px;font-size:22px;font-weight:800;flex-wrap:wrap}
.strip .row{gap:8px}
table.cl{border-collapse:collapse;font-size:24px;width:1040px}
table.cl th{font-size:17px;color:var(--mute);text-align:left;padding:6px 12px}
table.cl td{padding:7px 12px;border-top:1px solid var(--line)}
table.cl .n{text-align:right}
.pod td{color:var(--acc);font-size:28px}
.in{animation:in .7s cubic-bezier(.2,.9,.3,1.2) both}
.in2{animation:in .7s .3s cubic-bezier(.2,.9,.3,1.2) both}
.in3{animation:in .7s .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}
.pop{animation:pop .9s cubic-bezier(.2,1.4,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.scorri{display:flex;gap:26px;animation:scorri 40s linear infinite}
@keyframes scorri{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#cd{position:absolute;inset:0;background:#0B1030;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
#stage.auguri #scena{visibility:hidden}
#stage.auguri #cd{background:transparent;justify-content:flex-start}
.aug{display:flex;flex-direction:column;align-items:center;gap:36px;padding-top:70px}
.aug-t{font-size:150px;text-shadow:0 0 40px rgba(255,200,87,.45)}
.augc{display:flex;align-items:center;gap:34px;background:linear-gradient(180deg,rgba(255,246,229,.1),rgba(255,246,229,.04)) #1C244A;border:2px solid rgba(255,246,229,.14);border-radius:28px;padding:22px 34px;box-shadow:0 18px 40px -20px rgba(5,8,25,.9)}
#start{position:fixed;inset:0;z-index:40;background:radial-gradient(80% 60% at 50% -10%,#2B3A78 0%,rgba(27,35,70,0) 60%),linear-gradient(180deg,#1B2346,#141A38);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:20px}
.btn{background:linear-gradient(180deg,#FFD47E,#FFC145);box-shadow:0 8px 18px -8px rgba(255,193,69,.6),inset 0 1px 0 rgba(255,255,255,.45);color:#1B2346;border:0;border-radius:14px;padding:14px 26px;font-weight:800;font-size:18px;cursor:pointer;min-height:52px}
.btn.ghost{box-shadow:none;background:transparent;color:var(--ink);border:1px solid var(--line)}
input.txt{padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,246,229,.06);min-width:300px;font-size:18px;text-align:center}
.err{color:var(--bad);font-weight:700}
.karaoke a{color:#1B2346;background:var(--acc);text-decoration:none;border-radius:16px;padding:16px 28px;font-weight:800;font-size:28px;display:inline-block}
@media (prefers-reduced-motion:reduce){.in,.in2,.in3,.pop,.pulse,.scorri,.lights i{animation:none}}

/* dichiarazione d'amore */
#stage::before{content:'';position:absolute;inset:0;z-index:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none;
  background:radial-gradient(70% 60% at 50% 35%,rgba(255,120,160,.35),rgba(255,120,160,0) 70%),linear-gradient(180deg,#4A2152 0%,#2B1538 100%)}
#stage.romantico::before{opacity:1}
.amore-scena{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:34px;text-align:center}
.amore-tit{font-size:66px;color:#FF9EB1;text-shadow:0 0 30px rgba(255,92,122,.55)}
.amore-av{display:flex;flex-direction:column;align-items:center;gap:12px}
.amore-av .av{border-color:#FF9EB1;box-shadow:0 0 40px rgba(255,92,122,.45)}
.cuore-batte{animation:batte 1.1s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(255,60,100,.7))}
@keyframes batte{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(.98)}45%{transform:scale(1.08)}}
.termometro{position:absolute;right:46px;top:150px;display:flex;flex-direction:column;align-items:center;gap:8px;width:120px}
.termometro .tlabel{font-weight:800;font-size:16px;color:#FFD1DC;line-height:1.1}
.termometro .tbar{width:38px;height:300px;border-radius:19px;background:rgba(255,246,229,.12);border:2px solid rgba(255,158,177,.5);overflow:hidden;display:flex;align-items:flex-end}
.termometro .tbar i{display:block;width:100%;background:linear-gradient(0deg,#D9264A,#FF9EB1);border-radius:17px;transition:height .6s cubic-bezier(.2,.9,.3,1.2)}
.termometro .tnum{font-family:Fredoka;font-weight:700;font-size:30px;color:#FF9EB1}
.amore-banner-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);z-index:5;pointer-events:none;animation:sparisce .8s 4s forwards}
@keyframes sparisce{to{opacity:0;visibility:hidden}}
.amore-banner{font-family:Fredoka;font-weight:700;font-size:120px;color:#fff;background:linear-gradient(180deg,#FF7A93,#D9264A);padding:10px 50px;border-radius:30px;box-shadow:0 20px 60px rgba(120,10,40,.6)}
.lights.amore{background:linear-gradient(180deg,rgba(90,30,70,0),rgba(90,30,70,.6) 55%,#4A1E3E)}
.cuorelux{position:absolute;transform:translateX(-50%);animation:brilla 2.4s ease-in-out infinite;line-height:0}
@media (prefers-reduced-motion:reduce){.cuore-batte,.cuorelux{animation:none}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><div id="scena"></div><div id="omini" style="position:absolute;inset:0;pointer-events:none;z-index:15"></div><div id="video" style="position:absolute;inset:0;z-index:18;background:#000;display:none"></div><div id="cd"></div></div></div>
<script src="cielo.js" data-dentro="#stage"></script>
<canvas id="confetti"></canvas>
<div id="start"></div>
<audio id="musica" preload="auto"></audio>
<script src="vendor/supabase.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="config.js"></script>
<script src="omini.js"></script>
<script src="tv.js"></script>
</body>
</html>
