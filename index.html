<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Capodanno in Pigiama</title>
<meta name="theme-color" content="#1B2346">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pigiama">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B2346;--bg2:#232D58;--card:rgba(255,246,229,.08);--line:rgba(255,246,229,.18);
  --ink:#FFF6E5;--mute:#C9C6D6;--acc:#FFC857;--pink:#FF9EB1;--green:#1E5B43;--ok:#7FE0A0;--bad:#FF8A8A;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;min-height:100%}
body{min-height:100dvh;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,.f{font-family:'Fredoka',system-ui,sans-serif;margin:0;font-weight:700}
h2{font-size:26px}
h3{font-size:19px;margin-bottom:6px}
p{margin:0}
#app{flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto}
.head{padding:calc(14px + var(--safe-t)) 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:'Fredoka';font-weight:700;font-size:21px}
.logo span{color:var(--acc)}
.body{flex:1;padding:8px 18px 24px;display:flex;flex-direction:column;gap:14px}
.nav{position:sticky;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav button{flex:1;background:none;border:0;padding:12px 4px;font-weight:800;font-size:13px;color:var(--mute);min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.mute{color:var(--mute)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.btn{background:var(--acc);color:#1B2346;border:0;border-radius:14px;padding:13px 18px;font-weight:800;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,138,138,.5)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}
.wrapx{flex-wrap:wrap}
.av{width:44px;height:44px;border-radius:50%;flex:none;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:700;color:var(--acc);overflow:hidden;position:relative;border:2px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--mute)}
input[type=text],input[type=email],input[type=number],input[inputmode]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,246,229,.06);min-height:50px;font-size:16px}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.otp{letter-spacing:.4em;text-align:center;font-size:26px!important;font-family:'Fredoka'}
.err{color:var(--bad);font-size:13px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:800;font-size:13px;min-height:40px}
.chip.on{background:var(--acc);color:#1B2346;border-color:var(--acc)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:800;min-height:44px;color:var(--mute)}
.seg button.on{background:var(--bg2);color:var(--ink)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:transparent;width:100%;text-align:left;min-height:56px}
.opt.on{border-color:var(--acc);background:rgba(255,200,87,.12)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:1px}
.check.on{border-color:var(--acc)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.photo-pick{display:flex;align-items:center;gap:14px}
.photo-pick .big{width:96px;height:96px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;color:var(--mute);font-size:12px;text-align:center}
.photo-pick .big img{width:100%;height:100%;object-fit:cover}
.famphoto{width:100%;aspect-ratio:4/3;border-radius:16px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mute);background:rgba(255,246,229,.04)}
.famphoto img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:800}
.reminder{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);color:var(--pink);font-weight:700;font-size:14px}
.reminder:last-child{border-bottom:0}
.overlay{position:fixed;inset:0;background:rgba(8,11,30,.72);z-index:50;animation:velo 260ms var(--ease-out) both;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92dvh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#1B2346;padding:12px 18px;border-radius:14px;font-weight:800;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;flex:1;padding:30px 10px}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hero{text-align:center;padding:10px 0}
.hero .t{font-family:'Fredoka';font-weight:700;font-size:46px;line-height:1}
.moon{width:90px;height:90px;margin:0 auto 6px}
.big-num{font-family:'Fredoka';font-weight:700;font-size:64px;color:var(--acc);line-height:1}
.lights{display:flex;justify-content:center;gap:16px;padding:6px 0}
.lights i{width:9px;height:13px;border-radius:50%}
.pchips{display:flex;gap:8px;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:800;font-size:14px;min-height:46px;text-align:left}
.pchip small{display:block;font-size:11px;font-weight:700;opacity:.8}
.pchip.on{background:var(--acc);color:#1B2346;border-color:var(--acc)}
.pchip:disabled{opacity:.35;cursor:not-allowed}
.pchip .av{border-width:0}
.stars{display:flex;gap:4px;margin-top:4px}
.star{background:none;border:0;font-size:30px;line-height:1;padding:4px 6px;color:rgba(255,246,229,.22);min-width:44px;min-height:44px}
.star.on{color:var(--acc)}
.star:disabled{cursor:default}
table.tab{width:100%;border-collapse:collapse;font-size:14px}
table.tab th,table.tab td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.tab th{font-size:12px;color:var(--mute)}
table.tab .n{text-align:right}
.in{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in,.spinner{animation:none}}

/* ---- rifiniture da app nativa ---- */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-sheet:cubic-bezier(.32,.72,0,1)}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
input,textarea,select{font-size:16px}
button,a,label.btn,.check,.opt,.chip,.pchip,.star,[data-a]{touch-action:manipulation}
button,label.btn,.chip,.pchip,.seg,.nav,.tag,.star,.opt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn,.chip,.pchip,.opt,.seg button,.nav button,.star,.check{transition:transform 120ms var(--ease-out),background-color 160ms var(--ease-out),border-color 160ms var(--ease-out),color 160ms var(--ease-out),opacity 160ms}
.btn:active:not(:disabled),.chip:active,.pchip:active,.opt:active,.check:active{transform:scale(.97)}
.seg button:active,.nav button:active{transform:scale(.94)}
.star:active{transform:scale(.85)}
button:focus-visible,label.btn:focus-within,.check:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.sheet{overscroll-behavior:contain;animation:sheetsu 420ms var(--ease-sheet) both}
@keyframes velo{from{opacity:0}}
@keyframes sheetsu{from{transform:translateY(100%)}to{transform:none}}
.toast{animation:toastsu 260ms var(--ease-out) both}
@keyframes toastsu{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.in{animation:in 320ms var(--ease-out) both}
@media (prefers-reduced-motion:reduce){.sheet,.toast,.overlay{animation:none}.btn:active,.chip:active,.pchip:active,.opt:active,.check:active,.star:active{transform:none}}

/* ---- superfici del browser e dettagli ---- */
::selection{background:rgba(255,200,87,.38);color:var(--ink)}
input,textarea{caret-color:var(--acc)}
input::placeholder,textarea::placeholder{color:rgba(255,246,229,.5)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,246,229,.22) transparent}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
.big-num,table.tab,.otp,.stars{font-variant-numeric:tabular-nums}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.seg button.on{background:var(--bg);color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.25),0 0 0 1px rgba(255,200,87,.45)}
.check input{appearance:none;-webkit-appearance:none;border:2px solid var(--line);border-radius:7px;background:transparent;display:grid;place-content:center;transition:background-color 160ms var(--ease-out),border-color 160ms var(--ease-out)}
.check input::after{content:'';width:11px;height:6px;border:solid #1B2346;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) scale(0);transition:transform 160ms var(--ease-out);margin-top:-2px}
.check input:checked{background:var(--acc);border-color:var(--acc)}
.check input:checked::after{transform:rotate(-45deg) scale(1)}
.photo-pick .big{border-radius:50% / 44%;width:84px!important;height:104px!important}
.photo-pick .big img{object-fit:cover;width:100%;height:100%}

/* ---- più festa: cielo, profondità, ghirlanda ---- */
html{background:#141A38}
body{background:radial-gradient(120% 60% at 50% -10%,#2B3A78 0%,rgba(27,35,70,0) 60%),linear-gradient(180deg,#1B2346 0%,#151B3A 100%);background-attachment:fixed}
#app{position:relative;z-index:1}
.card{background:linear-gradient(180deg,rgba(255,246,229,.1),rgba(255,246,229,.04)) #1C244A;border-color:rgba(255,246,229,.14);box-shadow:0 12px 28px -16px rgba(5,8,25,.8),inset 0 1px 0 rgba(255,246,229,.09)}
.btn:not(.ghost):not(.danger){background:linear-gradient(180deg,#FFD47E,#FFC145);box-shadow:0 8px 18px -8px rgba(255,193,69,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.nav{background:rgba(21,27,58,.88);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
.logo{display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px;flex:none}
.reminder::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink);flex:none}
/* ghirlanda */
.lights{display:block;position:relative;height:40px;margin:6px auto 0;max-width:300px;padding:0}
.lights svg.filo{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lights i{position:absolute;width:10px;height:15px;border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;transform:translate(-50%,0);animation:brilla 2.4s ease-in-out infinite}
.lights i::before{content:'';position:absolute;left:2px;top:-4px;width:6px;height:5px;border-radius:2px;background:#3B4A3F}
@keyframes brilla{0%,100%{opacity:1;filter:brightness(1.1)}50%{opacity:.45;filter:brightness(.7)}}
/* conto alla rovescia */
.festa{position:relative;overflow:hidden;text-align:center;padding:22px 16px 14px;background:radial-gradient(90% 70% at 85% 0%,rgba(255,200,87,.18),rgba(255,200,87,0) 60%),linear-gradient(180deg,#26326A,#1D2650)}
.festa .moon{position:absolute;right:-6px;top:-6px;width:86px;height:86px;transform:rotate(-8deg);opacity:.95}
.festa .tit{font-family:'Fredoka';font-weight:600;font-size:17px;color:var(--mute);text-align:left;max-width:70%}
.conta{display:flex;justify-content:center;gap:10px;margin:18px 0 6px}
.conta div{min-width:78px;padding:10px 6px 8px;border-radius:16px;background:rgba(10,14,36,.45);box-shadow:inset 0 1px 0 rgba(255,246,229,.08),inset 0 -2px 0 rgba(0,0,0,.25)}
.conta b{display:block;font-family:'Fredoka';font-weight:700;font-size:44px;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.conta span{display:block;margin-top:4px;font-size:12px;font-weight:800;color:var(--mute)}
.festa .sotto{font-family:'Fredoka';font-weight:600;font-size:19px}
/* ingresso delle schede, una dopo l'altra */
.body.in{animation:none}
.body.in>*{animation:in 380ms var(--ease-out) both}
.body.in>*:nth-child(2){animation-delay:50ms}.body.in>*:nth-child(3){animation-delay:100ms}.body.in>*:nth-child(4){animation-delay:150ms}.body.in>*:nth-child(n+5){animation-delay:190ms}
@media (prefers-reduced-motion:reduce){.lights i,.body.in>*{animation:none}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spinner"></div></div></div>
<script src="cielo.js"></script>
<div id="omini" style="position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden"></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="omini.js"></script>
<script src="viso.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
